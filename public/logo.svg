<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="50.1%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <pattern id="ropePattern" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#dc2626" />
      <rect x="10" width="10" height="20" fill="#991b1b" />
    </pattern>
  </defs>

  <!-- Outer Black Shield Border -->
  <path d="M 250,10 C 370,10 480,90 480,220 C 480,420 350,560 250,605 C 150,560 20,420 20,220 C 20,90 130,10 250,10 Z" fill="#111827" stroke="#000000" stroke-width="4" />

  <!-- Inner Red Rope Shield Border -->
  <path d="M 250,22 C 358,22 462,98 462,220 C 462,408 340,542 250,588 C 160,542 38,408 38,220 C 38,98 142,22 250,22 Z" fill="#dc2626" />

  <!-- White Separator Line -->
  <path d="M 250,30 C 350,30 450,102 450,220 C 450,398 332,528 250,572 C 168,528 50,398 50,220 C 50,102 150,30 250,30 Z" fill="none" stroke="#ffffff" stroke-width="4" />

  <!-- Main Shield Area: Green & Yellow Diagonal Split -->
  <g clip-path="url(#shieldClip)">
    <clipPath id="shieldClip">
      <path d="M 250,34 C 345,34 444,104 444,220 C 444,392 328,520 250,564 C 172,520 56,392 56,220 C 56,104 155,34 250,34 Z" />
    </clipPath>
    
    <!-- Green Top-Left Half -->
    <path d="M 50,0 L 500,0 L 50,600 Z" fill="#15803d" />
    <!-- Yellow Bottom-Right Half -->
    <path d="M 50,600 L 500,0 L 500,600 Z" fill="#facc15" />
    <!-- Diagonal Dividing Black Line -->
    <line x1="50" y1="600" x2="500" y2="0" stroke="#111827" stroke-width="6" />
  </g>

  <!-- Top Yellow Ribbon "BARITO UTARA" -->
  <g id="topRibbon">
    <path d="M 90,140 L 140,110 L 360,110 L 410,140 L 370,170 L 130,170 Z" fill="#facc15" stroke="#111827" stroke-width="4" />
    <path d="M 90,140 L 130,170 L 120,135 Z" fill="#ca8a04" stroke="#111827" stroke-width="3" />
    <path d="M 410,140 L 370,170 L 380,135 Z" fill="#ca8a04" stroke="#111827" stroke-width="3" />
    <text x="250" y="148" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#111827" text-anchor="middle" letter-spacing="3">BARITO UTARA</text>
  </g>

  <!-- Yellow Star at Top Center -->
  <polygon points="250,175 257,196 279,196 261,209 268,230 250,217 232,230 239,209 221,196 243,196" fill="#facc15" stroke="#111827" stroke-width="3" />

  <!-- Crossed Spear (Tombak) & Mandau -->
  <!-- Mandau Blade -->
  <path d="M 120,200 C 200,280 300,350 370,380 L 350,395 C 280,360 180,280 110,210 Z" fill="#e2e8f0" stroke="#111827" stroke-width="3" />
  <path d="M 100,190 L 120,200 L 110,210 L 90,200 Z" fill="#78350f" stroke="#111827" stroke-width="3" />
  <!-- Spear (Tombak) -->
  <line x1="390" y1="180" x2="160" y2="390" stroke="#78350f" stroke-width="8" stroke-linecap="round" />
  <path d="M 390,180 L 420,150 L 405,195 Z" fill="#e2e8f0" stroke="#111827" stroke-width="3" />

  <!-- Rumah Adat / Talawang Centerpiece -->
  <g id="rumahAdat">
    <!-- Roof -->
    <path d="M 120,230 L 250,190 L 380,230 L 360,260 L 140,260 Z" fill="#1e293b" stroke="#111827" stroke-width="4" />
    <!-- Building Body -->
    <rect x="150" y="260" width="200" height="80" rx="8" fill="#1e293b" stroke="#111827" stroke-width="4" />
    <!-- Pillars / Windows -->
    <rect x="165" y="275" width="20" height="50" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect x="195" y="275" width="20" height="50" fill="#16a34a" stroke="#111827" stroke-width="2" />
    <rect x="240" y="275" width="20" height="50" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect x="285" y="275" width="20" height="50" fill="#16a34a" stroke="#111827" stroke-width="2" />
    <rect x="315" y="275" width="20" height="50" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <!-- Base Gong Oval -->
    <ellipse cx="250" cy="340" rx="90" ry="20" fill="#1e293b" stroke="#111827" stroke-width="4" />
    <ellipse cx="250" cy="340" rx="70" ry="12" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6" />
  </g>

  <!-- Padi (Rice Stalks - Left) -->
  <g id="padi" fill="#facc15" stroke="#111827" stroke-width="2">
    <path d="M 65,220 C 65,300 120,380 180,410 C 130,360 80,300 65,220 Z" />
    <!-- Rice Grains -->
    <circle cx="70" cy="230" r="8" />
    <circle cx="72" cy="250" r="9" />
    <circle cx="78" cy="270" r="9" />
    <circle cx="88" cy="290" r="10" />
    <circle cx="100" cy="310" r="10" />
    <circle cx="115" cy="330" r="10" />
    <circle cx="132" cy="350" r="10" />
    <circle cx="152" cy="370" r="10" />
  </g>

  <!-- Kapas (Cotton Blooms - Right) -->
  <g id="kapas" fill="#ffffff" stroke="#111827" stroke-width="2">
    <circle cx="410" cy="210" r="12" />
    <circle cx="420" cy="235" r="12" />
    <circle cx="415" cy="265" r="13" />
    <circle cx="405" cy="295" r="13" />
    <circle cx="390" cy="325" r="14" />
    <circle cx="370" cy="355" r="14" />
    <circle cx="345" cy="380" r="14" />
  </g>

  <!-- Ink Pot / Vessel at Bottom Center -->
  <ellipse cx="250" cy="405" rx="20" ry="14" fill="#111827" stroke="#ffffff" stroke-width="2" />
  <circle cx="250" cy="397" r="8" fill="#ffffff" />

  <!-- Bottom Ribbon "IYA MULIK BENGKANG TURAN" -->
  <g id="bottomRibbon">
    <path d="M 70,430 Q 250,560 430,430 L 400,480 Q 250,590 100,480 Z" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Ribbon Tails -->
    <path d="M 70,430 L 100,480 L 60,490 Z" fill="#cbd5e1" stroke="#111827" stroke-width="3" />
    <path d="M 430,430 L 400,480 L 440,490 Z" fill="#cbd5e1" stroke="#111827" stroke-width="3" />
    <!-- Curved Text or Segmented Text -->
    <text x="250" y="520" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#111827" text-anchor="middle" letter-spacing="2">IYA MULIK BENGKANG TURAN</text>
  </g>
</svg>
